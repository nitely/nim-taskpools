name: CI
on:
  push:
    branches:
      - stable
      - unstable
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/common.yml
    with:
      nim-versions: '["version-2-0", "version-2-2", "version-2-4", "devel"]'
      test-command: |
        nim -v
        nimble list --installed --version
        env NIMLANG=c nimble test
        env NIMLANG=c nimble test_stall

  # ulimit -c unlimited
        
